<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Redirecting… | TechNext Asia</title>
<script>
(function() {
  var path = window.location.pathname;
  var search = window.location.search;

  // Redirect old /AI Article/ and /AI%20Article/ paths to /ai-article/
  var newPath = path
    .replace(/\/AI%20Article\//gi, '/ai-article/')
    .replace(/\/AI Article\//gi, '/ai-article/')
    .replace(/\/images\/hero%20image\//gi, '/images/hero-image/')
    .replace(/\/images\/hero image\//gi, '/images/hero-image/');

  if (newPath !== path) {
    window.location.replace(newPath + search);
  } else {
    // Generic 404 — redirect to homepage after 3s
    setTimeout(function() {
      window.location.replace('https://technext.asia/');
    }, 3000);
  }
})();
</script>
