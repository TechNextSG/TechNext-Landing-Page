body {
  background: #f0ece3;
  color: #1a1a2e;
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }

:root {
  --bg: #f0ece3;
  --white: #ffffff;
  --blue: #2563eb;
  --blue-dark: #1d4ed8;
  --text: #1a1a2e;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --plum: #6d2d7a;
  --handwriting: 'Caveat', cursive;
  --sans: 'DM Sans', sans-serif;
}
html.lang-vn { --handwriting: 'Be Vietnam Pro', 'Caveat', cursive; }

/* ===== NAV ===== */
nav#mainNav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border-bottom: none;
  padding: 0 4%;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
nav#mainNav { transition: transform 0.35s ease; }
nav#mainNav.nav-hidden { transform: translateY(-100%); }
.nav-logo {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.logo-img { height: 88px; width: auto; mix-blend-mode: multiply; }
.nav-links {
  display: flex;
  align-items: center;
  gap: 2rem;
  list-style: none;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
}
.nav-links a {
  font-size: 0.875rem;
  font-weight: 500;
  color: #475569;
  transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active { color: var(--text); }
.nav-apply {
  padding: 9px 22px;
  background: var(--plum);
  color: #fff;
  border-radius: 100px;
  font-size: 0.82rem;
  font-weight: 600;
  font-family: var(--sans);
  transition: all 0.25s;
  white-space: nowrap;
}
.nav-apply:hover { background: #5a2568; transform: translateY(-1px); }
.nav-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.lang-switcher { display: flex; gap: 2px; background: rgba(0,0,0,0.06); border-radius: 8px; padding: 3px; }
.lang-btn { background: none; border: none; color: #94a3b8; font-size: 0.68rem; font-weight: 700; font-family: var(--sans); letter-spacing: 0.06em; padding: 4px 9px; border-radius: 5px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
.lang-btn.active { background: var(--blue); color: #fff; box-shadow: 0 1px 4px rgba(37,99,235,0.3); }
.lang-btn:hover:not(.active) { color: var(--text); background: rgba(0,0,0,0.05); }
.hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 6px; }
.hamburger span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: all 0.3s; }
.hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }

/* ===== ENTRANCE ANIMATIONS ===== */
@keyframes tn-logo-in {
  from { opacity: 0; transform: translateY(-22px) scale(0.92); }
  to   { opacity: 1; transform: translateY(0)    scale(1); }
}
@keyframes tn-navlinks-in {
  from { opacity: 0; transform: translateX(-50%) translateY(-16px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes tn-navright-in {
  from { opacity: 0; transform: translateY(-16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.nav-logo  { animation: tn-logo-in     0.72s cubic-bezier(0.34,1.56,0.64,1) 0.05s both; }
.nav-links { animation: tn-navlinks-in 0.60s cubic-bezier(0.25,0.46,0.45,0.94) 0.20s both; }
.nav-right { animation: tn-navright-in 0.60s cubic-bezier(0.25,0.46,0.45,0.94) 0.30s both; }

/* ===== PAGE HEADER ===== */
.page-header {
  padding: 80px 6% 60px;
  max-width: 1280px;
  margin: 0 auto;
}
.page-label {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--handwriting);
  font-size: 1.6rem;
  font-weight: 600;
  font-style: italic;
  color: var(--blue);
  margin-bottom: 1rem;
}
.page-label::before {
  content: '';
  display: inline-block;
  width: 28px; height: 3px;
  background: var(--blue);
  border-radius: 1px;
}
.page-title {
  font-family: var(--handwriting);
  font-size: clamp(2.4rem, 4vw, 3.8rem);
  font-weight: 700;
  color: var(--text);
  line-height: 1.1;
  margin-bottom: 1rem;
}
.page-title .highlight {
  position: relative;
  display: inline-block;
  z-index: 0;
}
.page-title .highlight::after {
  content: '';
  position: absolute;
  left: 0; bottom: 4px;
  width: 100%; height: 10px;
  background: #fef08a;
  z-index: -1;
  border-radius: 3px;
}
.page-sub {
  font-size: 1rem;
  color: #475569;
  line-height: 1.75;
  max-width: 560px;
}

/* ===== GALLERY FILTERS ===== */
.gallery-filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  padding: 0 4%;
  max-width: 1280px;
  margin: 0 auto 3rem;
}
.filter-btn {
  padding: 8px 20px;
  border-radius: 100px;
  font-size: 0.8rem;
  font-weight: 600;
  font-family: var(--sans);
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: var(--white);
  color: var(--text-muted);
  transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--blue); color: var(--blue); }
.filter-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

/* ===== GALLERY GRID ===== */
.gallery-wrap {
  padding: 0 6% 100px;
  max-width: 1280px;
  margin: 0 auto;
}
.gallery-grid {
  columns: 3;
  column-gap: 1.2rem;
}
.gallery-item {
  break-inside: avoid;
  margin-bottom: 1.2rem;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  display: block;
}
.gallery-item img {
  width: 100%;
  display: block;
  border-radius: 16px;
  transition: transform 0.4s ease;
}
.gallery-item:hover img { transform: scale(1.04); }

/* Placeholder boxes */
.gallery-placeholder {
  background: #111827;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  transition: background 0.2s;
  break-inside: avoid;
  margin-bottom: 1.2rem;
  position: relative;
  overflow: hidden;
}
.gallery-placeholder:hover { background: #1e2d3d; }
.gallery-placeholder .ph-icon {
  width: 36px; height: 36px;
  opacity: 0.2;
}
.gallery-placeholder .ph-label {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.18);
}
.gallery-placeholder .ph-cat {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.1);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ===== LIGHTBOX ===== */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 2000;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}
.lightbox.open { display: flex; }
.lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 12px; object-fit: contain; }
.lightbox-close {
  position: absolute;
  top: 1.5rem; right: 1.5rem;
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  width: 40px; height: 40px;
  border-radius: 50%;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.lightbox-close:hover { background: rgba(255,255,255,0.2); }

/* ===== FOOTER ===== */
footer {
  background: var(--text);
  color: rgba(255,255,255,0.65);
  padding: 1rem 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.8rem;
}
.footer-brand { display: flex; align-items: center; }
.footer-logo-img { height: 36px; width: auto; filter: brightness(0) invert(1); }
.footer-copy { font-size: 0.78rem; }
.footer-links { display: flex; gap: 1.4rem; }
.footer-links a { font-size: 0.78rem; transition: color 0.2s; }
.footer-links a:hover { color: #fff; }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .gallery-grid { columns: 2; }
}
@media (max-width: 768px) {
  nav#mainNav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border-bottom: none;
  padding: 0 4%;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
  .hamburger { display: flex; background: rgba(0,0,0,0.07); border-radius: 10px; padding: 8px; transition: background 0.2s; }
  .hamburger.open { background: rgba(37,99,235,0.12); }
  .hamburger.open span { background: var(--blue); }
  .nav-links { display: none; }
  .nav-apply { display: inline-flex; padding: 6px 13px; font-size: 0.72rem; letter-spacing: 0.01em; }

    from { opacity: 0; transform: scale(0.82) translateY(-8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .nav-links.open {
    display: flex; flex-direction: column; position: fixed;
    top: 72px; right: 16px; left: auto; min-width: 180px;
    background: #fff; border-radius: 18px;
    padding: 6px; gap: 2px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid rgba(0,0,0,0.06);
    z-index: 1200; transform-origin: top right;
    animation: navMenuIn 0.22s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .nav-links.open li { border-bottom: none; }
  .nav-links.open a { display: block; padding: 0.75rem 1.1rem; font-size: 0.92rem; border-radius: 12px; color: var(--text); font-weight: 500; transition: background 0.15s; }
  .nav-links.open a:hover { background: rgba(0,0,0,0.05); }
  .nav-links.open a.active { color: var(--blue); font-weight: 600; }
  .logo-img { height: 44px !important; width: auto; mix-blend-mode: multiply; }
  .lang-switcher { position: relative; background: none; padding: 0; gap: 0; border-radius: 0; }
  .lang-btn { display: none; }

  .lang-switcher.open .lang-btn { display: block; text-align: center; padding: 6px 10px; border-radius: 6px; color: var(--text-muted); font-size: 0.7rem; letter-spacing: 0.05em; }

  .lang-switcher.open .lang-btn:hover:not(.active) { background: rgba(0,0,0,0.05); color: var(--text); }
  footer { flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 0.8rem; padding: 1.5rem 5%; }

  /* ── Section spacing ── */
  .page-header { padding: 56px 5% 32px !important; }
  .section-title, .page-title { font-size: clamp(2.6rem, 9vw, 3.4rem) !important; line-height: 1.08; }
  .page-label { font-size: 1.3rem; }
  .section-sub, .page-sub { font-size: 0.88rem; }
  .cta-primary { padding: 13px 26px; font-size: 0.88rem; }

  /* ── Gallery grid ── */
  .gallery-grid { columns: 1 !important; gap: 0.7rem; }
  .gallery-item { margin-bottom: 0.7rem; break-inside: avoid; }
  .gallery-item img { border-radius: 12px; }
}
@media (max-width: 560px) {
  .gallery-grid { columns: 1; }
}

function setLang(lang) {
  localStorage.setItem('tn_lang', lang);
  document.documentElement.classList.toggle('lang-vn', lang === 'vn');
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === lang));
  const t = LANG[lang];
  document.querySelectorAll('[data-k]').forEach(el => { if (t[el.dataset.k] !== undefined) el.textContent = t[el.dataset.k]; });
}

function filterGallery(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));

    item.style.display = (cat === 'all' || item.dataset.cat === cat) ? 'block' : 'none';

}

<script>
/* ── Nav hide-on-scroll-down / show-on-scroll-up ── */
(function(){
  var nav = document.getElementById('mainNav');
  if (!nav) return;
  var lastY = 0, ticking = false;
  window.addEventListener('scroll', function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      var y = window.scrollY || window.pageYOffset;
      if (y > lastY && y > 80) {
        nav.classList.add('nav-hidden');
      } else {
        nav.classList.remove('nav-hidden');
      }
      lastY = y < 0 ? 0 : y;
      ticking = false;
    });
  }, { passive: true });
})();
</script>
